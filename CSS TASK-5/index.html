<script>
(function(){
  var form=document.getElementById('searchForm');
  var q=document.getElementById('q');
  var cat=document.getElementById('cat');
  var status=document.getElementById('status');
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function say(){
    var kw=q.value.trim();
    var c=cat.value;
    var where=c?c:'all art';
    status.innerHTML=kw
      ? 'Searching '+esc(where)+' for “'+esc(kw)+'”…'
      : 'Browsing '+esc(where)+'.';
  }
  form.addEventListener('submit',function(e){e.preventDefault();say()});
  document.getElementById('grid').addEventListener('click',function(e){
    var t=e.target.closest('.tile'); if(!t) return;
    var name=t.getAttribute('data-cat');
    for(var i=0;i<cat.options.length;i++){ if(cat.options[i].text===name){cat.selectedIndex=i;break} }
    say();
    window.scrollTo({top:0,behavior:'smooth'});
    q.focus({preventScroll:true});
  });
})();
</script>
