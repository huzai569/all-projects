<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        header {
            background-color: #333;
            color: #fff;
            padding: 10px 0;
            text-align: center;
        }
        nav a {
            color: #fff;
            margin: 0 15px;
            text-decoration: none;
        }
        main {
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        form p {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input[type="email"],
        input[type="password"] {
            width: calc(100% - 20px);
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 10px 15px;
            background-color: #333;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #555;
        }
        footer {
            text-align: center;
            padding: 10px 0;
            background-color: #333;
            color: #fff;
            position: fixed;
            width: 100%;
            bottom: 0;
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to My Website</h1>
        <nav>
                <a href="index.html">Home</a>
                <a href="signup1.html">Sign Up</a>
        </nav>
    </header>
    
    <main>
        <h2>LOGIN </h2>
        <form action="signup1.html" method="get">
            <p>
                <label for="login-email">Email:</label><br>
                <input type="email" id="login-email" name="email" required>
            </p>
            <p>
                <label for="login-password">Password:</label><br>
                <input type="password" id="login-password" name="password" required>
            </p>
            <p>
                <button type="submit">Login</button>
            </p>
            <p>
                Don't have an account? <a href="signup1.html">SIGN UP</a>
            </p>
        </form>
    </main>
    <footer>
        <p>&copy;  Copyright reserved 2026 My Website</p>
    </footer>
</body>
</html>
