<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGN UP - Step 3</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        header {
            background-color: #333;
            color: #fff;
            padding: 10px 0;
            text-align: center;
        }
        nav a {
            color: #fff;
            margin: 0 15px;
            text-decoration: none;
        }
        main {
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        form p {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input[type="text"],
        input[type="number"],
        input[type="month"],
        input[type="file"],
        select,
        textarea {
            width: calc(100% - 20px);
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 10px 15px;
            background-color: #333;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #555;
        }
        footer {
            text-align: center;
            padding: 10px 0;
            background-color: #333;
            color: #fff;
        }
    </style>
</head>
<body>
     <header>
        <h1>Sign Up Form</h1>
        <p>Step 3 of 4: Work Experience</p>
        <nav><a href="index.html">Home</a></nav>
    </header>

    <main>
        <h2>Work Experience</h2>
        <form action="signup4.html" method="get" enctype="multipart/form-data">
            <p>
                <label for="job-title">Current Job Title:</label><br>
                <input type="text" id="job-title" name="job-title">
            </p>

            <p>
                <label for="experience">Years of Experience:</label><br>
                <input type="number" id="experience" name="experience" min="0" max="60">
            </p>

            <p>
                <label for="start-date">Employment Start Date:</label><br>
                <input type="month" id="start-date" name="start-date">
            </p>

            <p>
                <label for="resume">Upload Resume:</label><br>
                <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx">
            </p>

            <p>
                <label for="skills">Skills (type or choose a suggestion):</label><br>
                <input list="skill-list" id="skills" name="skills">
                <datalist id="skill-list">
                    <option value="HTML">
                    <option value="CSS">
                    <option value="JavaScript">
                    <option value="React">
                    <option value="Communication">
                    <option value="Problem Solving">
                    <option value="Teamwork">
                </datalist>
            </p>

            <p><button type="submit">Next</button></p>
        </form>
    </main>
    <footer>
        <p>&copy;  Copyright reserved 2026 My Website</p>
    </footer>
</body>
</html>
